name: Strict release validation

on:
  workflow_dispatch:
    inputs:
      previous_artifact:
        description: Optional path to a prior release-manifest.json for rollback identity metadata
        required: false
        type: string

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22.14.0
          cache: npm
      - run: npm ci
      - run: node --test tests/release/*.test.mjs
      - run: npm run build
      - run: node scripts/release/validate.mjs --dist dist
      - name: Generate inventory-backed release artifact
        env:
          PREVIOUS_ARTIFACT: ${{ inputs.previous_artifact }}
        shell: bash
        run: |
          if [[ -n "$PREVIOUS_ARTIFACT" ]]; then
            node scripts/release/artifact.mjs --dist dist --previous "$PREVIOUS_ARTIFACT"
          else
            node scripts/release/artifact.mjs --dist dist
          fi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: wild-crown-release-${{ github.sha }}
          path: |
            dist/
            evidence/release/benchmarks.json
            evidence/assets/
          if-no-files-found: error
          retention-days: 90
